services:
  server:
    build: ./server
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file before running compose}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in a .env file before running compose}
      MONGODB_DB: ${MONGODB_DB:-aws_exam_simulator}
      CORS_ORIGIN: http://localhost:8080
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
