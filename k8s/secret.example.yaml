# DO NOT put a real secret in this file and commit it to Git.
#
# Instead, create the secret imperatively on the cluster:
#
#   kubectl create secret generic app-secrets \
#     --namespace aws-exam \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 48)"
#
# This file is kept only as documentation of the secret's shape.
# If you ever do need a committed manifest for GitOps, encrypt it first
# (e.g. with Sealed Secrets or SOPS) rather than checking in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: aws-exam
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_DO_NOT_COMMIT_A_REAL_SECRET_HERE"
