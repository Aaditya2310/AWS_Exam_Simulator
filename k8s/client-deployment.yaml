apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: aws-exam
spec:
  replicas: 1 # bump to 2 once the node has headroom — nginx here is stateless
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: adisru/aws-exam-client:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: aws-exam
spec:
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
