# Routes all traffic to the client service (nginx), which internally
# reverse-proxies /api/* to the server service - see client/nginx.conf.
# TLS is handled entirely by Traefik via the annotations below, using the
# ACME resolver configured in traefik-tls-config.yaml. No k8s TLS Secret
# needed - Traefik manages the certificate itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: aws-exam
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: aws-exam-simulator.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80