server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets and the SPA shell
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy to the backend. "server" resolves via Docker Compose's
    # embedded DNS or Kubernetes' in-cluster DNS to the backend service —
    # if you rename that service, update this and rebuild the image.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
